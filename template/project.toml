# Machine-readable project settings. Scripts read this file.
[project]
name = "{{PROJECT}}"
prefix = "{{PREFIX}}"
part = "{{PART}}"
default_clock_mhz = {{CLOCK_MHZ}}
kit_version = "{{KIT_VERSION}}"
ip_vendor = "{{IP_VENDOR}}"
ip_version = "1.0"

[profile]
team = "{{TEAM}}"
deliverables = [{{DELIVERABLES_TOML}}]
options = [{{OPTIONS_TOML}}]
dispatch = "{{DISPATCH}}"
max_attempts = {{MAX_ATTEMPTS}}

# Tools (Vivado, Verilator, Ross, ...) are not pinned: the project uses what the machine has.
# Model aliases -> ids (used in agent files) and names (recorded in commit trailers).
{{MODELS_TOML}}

[locks]
# Paths that change only with user approval (checked by `make check-locks`).
# Add delivered paths here to freeze them (e.g. "hw/rtl/uart/**").
paths = [{{LOCKS_TOML}}]
base_ref = "main"
