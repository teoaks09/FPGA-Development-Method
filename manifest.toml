# Canonical project tree. Every project has the same paths; the profile only decides which exist.
# path  : file, or folder ending in "/" (copies its template subtree; empty folders get .gitkeep)
# when  : all clauses must hold; "a|b" = either. Keys: team (L1..L4), deliverable, option.
#         deliverable "code" is always present. Empty = always.
# show / where : row for the "Where is what" table in AGENTS.md
# Every file under template/ must be covered (tools/new_project.py checks this).

[[path]]
path = "AGENTS.md"
where = "Instructions for every agent and tool (single source; CLAUDE.md imports it)"
[[path]]
path = "CLAUDE.md"
[[path]]
path = "README.md"
where = "User documentation (Turkish): what it does, interfaces, registers, usage"
[[path]]
path = "project.toml"
where = "Profile, models, locked paths"
[[path]]
path = "Makefile"
where = "Entry points (`make help`)"
[[path]]
path = ".gitignore"
[[path]]
path = ".claude/settings.json"
[[path]]
path = ".claude/skills/new-feature/"
show = ".claude/skills/"
where = "Project skills (AMD Ross skills are installed globally)"
[[path]]
path = ".claude/skills/deliver/"
[[path]]
path = ".claude/skills/task-card/"
when = ["team=L2,L3,L4"]
[[path]]
path = ".claude/skills/llm-wiki/"
when = ["option=wiki"]
[[path]]
path = "opencode.json"
when = ["team=L2,L3,L4"]

[[path]]
path = "docs/requirements.md"
show = "docs/requirements.md"
where = "What the user wants (approved; locked)"
[[path]]
path = "docs/coding_rules.md"
where = "Coding and testbench rules (locked)"
[[path]]
path = "docs/specs/_template.md"
show = "docs/specs/<feature>.md"
where = "One short spec per feature"
[[path]]
path = "docs/decisions.md"
where = "One line per decision"
[[path]]
path = "docs/external/"
where = "Original documents from outside, unchanged"
[[path]]
path = "docs/hardware_test.md"
when = ["deliverable=hwtest"]
where = "Hardware test procedure (Turkish)"

[[path]]
path = "hw/rtl/common/"
show = "hw/rtl/<feature>/"
where = "RTL per feature (files.f = compile list); common/ = shared package"
[[path]]
path = "hw/tb/common/"
show = "hw/tb/<feature>/"
where = "Testbench per feature (SystemVerilog); common/ = framework"
[[path]]
path = "hw/tb/acceptance/"
when = ["team=L3"]
where = "Acceptance testbenches by Claude, locked for free models"
[[path]]
path = "hw/constraints/ooc/"
where = "Out-of-context timing constraints"
[[path]]
path = "hw/constraints/ip/"
when = ["deliverable=ip,board"]
where = "Scoped XDC that travels with the design"
[[path]]
path = "hw/xilinx_ip/"
when = ["option=xilinx_ip"]
where = "One Tcl per Xilinx IP instance (no .xci)"
[[path]]
path = "hw/hls/"
when = ["option=hls"]
show = "hw/hls/<kernel>/"
where = "Vitis HLS sources"
[[path]]
path = "hw/ip_package/"
when = ["deliverable=ip"]
where = "Custom IP packaging script (output in build/ip/)"
[[path]]
path = "hw/boards/__BOARD__/"
when = ["deliverable=board"]
where = "Board top, board XDC, block design Tcl"
[[path]]
path = "sw/"
when = ["deliverable=sw"]
where = "Product software: driver over HAL, bare-metal/Linux apps"
[[path]]
path = "utils/"
when = ["deliverable=hwtest"]
where = "Test tools, not delivered (host/ = PC, target/ = PS)"

[[path]]
path = "flow/project_value.py"
show = "flow/"
where = "Automation: vivado/, sim/, checks/, gen/, git/, tools/"
[[path]]
path = "flow/vivado/common.tcl"
[[path]]
path = "flow/vivado/lint.tcl"
[[path]]
path = "flow/vivado/ooc_synth.tcl"
[[path]]
path = "flow/vivado/create_project.tcl"
[[path]]
path = "flow/vivado/build_board.tcl"
when = ["deliverable=board"]
[[path]]
path = "flow/sim/run_sim.sh"
[[path]]
path = "flow/checks/check_feature.sh"
[[path]]
path = "flow/checks/lint.sh"
[[path]]
path = "flow/checks/check_locked.py"
[[path]]
path = "flow/checks/check_trace.py"
[[path]]
path = "flow/checks/env_check.sh"
[[path]]
path = "flow/checks/wiki_lint.py"
when = ["option=wiki"]
[[path]]
path = "flow/gen/new_feature.py"
[[path]]
path = "flow/gen/codemap.py"
when = ["option=wiki"]
[[path]]
path = "flow/git/commit.sh"
when = ["team=L2,L3,L4"]

[[path]]
path = "tracking/status.md"
show = "tracking/"
where = "During the project only: status.md (read first), task cards, scorecard"
[[path]]
path = "tracking/tasks/_template.md"
when = ["team=L2,L3,L4"]
[[path]]
path = "tracking/tasks/_result_template.md"
when = ["team=L2,L3,L4"]
[[path]]
path = "tracking/tasks/_review_template.md"
when = ["team=L2,L3,L4"]
[[path]]
path = "tracking/model_scorecard.md"
when = ["team=L2,L3,L4"]
[[path]]
path = "tracking/start_prompt.md"
when = ["team=L4"]

[[path]]
path = "llm/wiki/"
when = ["option=wiki"]
where = "Knowledge for LLMs: index.md first, SCHEMA.md = rules, codemap/ = one card per module"
[[path]]
path = "llm/raw/"
when = ["option=wiki"]
where = "Sources for the wiki (local/ is git-ignored)"
