# Canonical project tree. Every project has the same paths; the profile only decides which exist.
# path   : file, or folder ending in "/" (folder = copy its template subtree, or create it empty)
# when   : all conditions must hold. Keys: weight, team, deliverable, option. Empty = always.
#          deliverable "code" is always present. Options are switched on with --with.
# where  : description for the "Where is what" table in AGENTS.md (omit to leave it out)
# show   : path shown in that table (default: path)
# Every file under template/ must be covered by an entry (tools/new_project.py checks this).

# ---------------------------------------------------------------- root
[[path]]
path = "AGENTS.md"
where = "Instructions for every agent and tool (single source; CLAUDE.md imports it)"
[[path]]
path = "CLAUDE.md"
[[path]]
path = "project.toml"
where = "Machine-readable profile, tool versions, models, locked paths"
[[path]]
path = "Makefile"
where = "Flow entry points (`make help`)"
[[path]]
path = ".gitignore"
[[path]]
path = ".mcp.json"
[[path]]
path = ".claude/settings.json"
[[path]]
path = "opencode.json"
when = ["team=L2,L3,L4"]
[[path]]
path = ".claude/skills/"
where = "Project skills + AMD Ross skills (linked from third_party/, pinned version)"
when = ["weight=standard,comprehensive"]

# ---------------------------------------------------------------- docs/input (approval needed)
[[path]]
path = "docs/input/external/"
show = "docs/input/"
where = "Inputs fixed at setup (requirements, constitution, coding rules); change only with approval. external/ = original documents"
[[path]]
path = "docs/input/customer_needs.md"
when = ["weight=comprehensive"]
[[path]]
path = "docs/input/system_requirements.md"
[[path]]
path = "docs/input/constitution.md"
[[path]]
path = "docs/input/coding_rules.md"
[[path]]
path = "docs/input/development_environment.md"
when = ["weight=standard,comprehensive"]
[[path]]
path = "docs/input/project_plan.md"
when = ["weight=standard,comprehensive"]

